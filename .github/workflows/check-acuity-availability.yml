name: Check Acuity Availability

on:
  schedule:
    # 15:00 UTC (11:00 AM ET / 8:00 AM PT), Monday-Friday only.
    # Adjust the hour to taste — cron time is always UTC.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      force_report:
        description: >-
          Always file a verification issue with the screenshot attached,
          even if no availability is found. Handy for confirming the
          checker actually works (e.g. the first run).
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: check-acuity-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run availability check
        id: check
        continue-on-error: true
        run: npm run check

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acuity-check-${{ github.run_id }}
          path: |
            result.json
            acuity-check.png
          retention-days: 14
          if-no-files-found: ignore

      # actions/github-script's Octokit client has no endpoint for attaching
      # media to issues — that's a gh-CLI-specific feature (see
      # scripts/report-issue.sh for the changelog link), so make sure the
      # runner's gh is new enough to have it rather than trusting whatever
      # ubuntu-latest happens to ship.
      - name: Ensure GitHub CLI supports --attach
        if: always()
        run: |
          set -euo pipefail
          type -p curl >/dev/null || (sudo apt-get update && sudo apt-get install -y curl)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo tee /usr/share/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Report result via GitHub issue
        if: always()
        env:
          # A PAT with issues read/write, stored as the GH_TOKEN repo secret —
          # gh's --attach upload rejects the default GITHUB_TOKEN (see the
          # comment at the top of report-issue.sh), so a real PAT is required
          # to get the screenshot attached inline instead of just linked.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_report || 'false' }}
        run: ./scripts/report-issue.sh

      - name: Fail job if the check script crashed
        if: steps.check.outcome == 'failure'
        run: exit 1
